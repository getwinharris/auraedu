# AuraEdu — project knowledge index (Open Knowledge Framework).
# Queryable map of repo structure and content declared in each file's YAML frontmatter. Live record values come from the remote bridge, not this file.
format: auraedu-knowledge-index
version: "1.0"
generated_by: cli/generate-okf-index.php
authoritative_sources:
  routes: app/routes.php
  services: "app/Services/*.php"
  schema: storage/schema/collections.php
  blog: "content/blog/posts/*.md"
  docs: "docs/**/*.md"
  skills: ".agents/skills/*/SKILL.md"
  images: "assets/images/**/*"
discovery:
  - question: "Does a route/controller/service/view/collection exist and how do they connect?"
    use: map.mmd
  - question: "What is a live product/category/consultant/admin-editable value?"
    use: remote_url via /remotedb
  - question: "What does a blog article / doc declare in its frontmatter?"
    use: concepts filtered by type
  - question: "What repository instructions or skill apply?"
    use: AGENTS.md then concepts by type skill
query_examples:
  - "sed -n '1,80p' index.yaml"
  - "rg -n -A12 'id: \"doc:' index.yaml"
  - "rg -n -A14 'type: \"blog\"' index.yaml"
  - "rg -n -A12 'type: \"skill\"' index.yaml"
summary:
  doc: 35
  blog: 9
  legal: 2
  route: 126
  service: 42
  controller: 15
  schema: 19
  skill: 1
  image: 15
